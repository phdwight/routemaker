name: Release — test, bump, build & publish

# Version sync (tag-driven): git tags vX.Y.Z are the source of truth. On every
# merge to main, CI computes the next version, pushes the tag, bakes that version
# into the image's VERSION file, and tags the image :X.Y.Z + :latest. The app
# reads /VERSION at runtime, so the running app, the git tag, and the image tag
# always report the same version. No commit is pushed to protected main — only a
# tag (tags are not branch-protected). The committed VERSION file is the seed for
# the first release and a floor you can raise for a minor/major bump.

on:
  push:
    branches: [main, develop]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "VERSION"
      - "*.svg"
      - "*.png"
      - "site.webmanifest"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint & validate
        run: |
          set -e
          node --check app.js
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8'))"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION || { echo "VERSION is not semver"; exit 1; }
          test -f index.html && test -f style.css && test -f Dockerfile
          echo "✓ tests passed"

  # ---------------------------------------------------------------- bump (main only)
  # Next version = max(latest tag's patch+1, committed VERSION floor). Seeds from the
  # committed VERSION when no tags exist yet (first release = 1.0.0). Pushes only the
  # annotated tag onto the merge commit; exposes version + sha.
  bump:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: bump
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FLOOR="$(cat VERSION)"
          LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            NEW="$FLOOR"
            echo "No tags yet — seeding first release v$NEW"
          else
            CUR="${LATEST#v}"
            BUMPED="$(awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}' <<< "$CUR")"
            NEW="$(printf '%s\n%s\n' "$BUMPED" "$FLOOR" | sort -V | tail -1)"
            echo "Latest $LATEST → v$NEW (floor $FLOOR)"
          fi
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "Tag v$NEW already exists; not re-creating"
          else
            git tag -a "v$NEW" -m "RouteMaker v$NEW"
            git push origin "v$NEW"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- build & publish
  build:
    needs: [test, bump]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.bump.result == 'success' || needs.bump.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}
      - id: ver
        name: Resolve & bake version
        run: |
          V="${{ needs.bump.outputs.version }}"
          [ -z "$V" ] && V="$(cat VERSION)"
          echo "$V" > VERSION            # bake the resolved version into the image
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Derive image tags & labels
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.ver.outputs.value }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image contains no secrets
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker pull "$IMAGE"
          LEAKED="$(docker run --rm --entrypoint sh "$IMAGE" -c \
            'find /usr/share/nginx/html /etc/nginx \( -name ".env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" -o -name "*secret*" \) 2>/dev/null || true')"
          if [ -n "$LEAKED" ]; then echo "::error::Potential secrets in image:"; echo "$LEAKED"; exit 1; fi
          echo "✓ no secrets"
      - name: Verify published version matches the tag
        if: ${{ needs.bump.result == 'success' }}
        run: |
          V="${{ steps.ver.outputs.value }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$V"
          docker pull "$IMAGE"
          INSIDE="$(docker run --rm --entrypoint cat "$IMAGE" /usr/share/nginx/html/VERSION | tr -d '[:space:]')"
          echo "git tag=v$V   image :$V VERSION=$INSIDE"
          [ "$INSIDE" = "$V" ] || { echo "::error::image VERSION ($INSIDE) != tag ($V)"; exit 1; }
          echo "✓ app version, git tag and image tag all report $V"

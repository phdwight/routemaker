name: Build & Publish Docker image

on:
  push:
    branches: [main, develop]
    # Only rebuild when something that actually ends up in the image changes.
    # Docs-only edits (e.g. README.md) are ignored, so no needless republish.
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "*.svg"
      - "*.png"
      - "site.webmanifest"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
    tags: ["v*.*.*"]
  # Manual escape hatch — e.g. to publish a release tagged on a docs-only commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry (ghcr.io)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Emulation so the amd64 runner can also build the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No password stored as a secret — GITHUB_TOKEN is minted per-run.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Lean images: reuse layers across runs via the GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the build if a secret/.env leaks into the application content.
      # Only the paths we COPY into can carry our own files — the base image's
      # public CA bundle under /etc/ssl lives elsewhere and is intentionally ignored.
      - name: Verify image contains no secrets
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Inspecting $IMAGE"
          docker pull "$IMAGE"
          LEAKED="$(docker run --rm --entrypoint sh "$IMAGE" -c \
            'find /usr/share/nginx/html /etc/nginx \( -name ".env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" -o -name "*secret*" \) 2>/dev/null || true')"
          if [ -n "$LEAKED" ]; then
            echo "::error::Potential secrets found in application content:"; echo "$LEAKED"; exit 1
          fi
          echo "No secrets or .env files found in application content. ✅"

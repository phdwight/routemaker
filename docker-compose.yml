services:
  routemaker:
    build: .
    image: routemaker:latest
    container_name: routemaker
    ports:
      - "8517:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

services:
  routemaker:
    # Pulls the published public image from GitHub Container Registry, so this
    # file works standalone on any device with Docker — no source code needed.
    # For local development that builds from source, add the build override:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/phdwight/routemaker:latest
    pull_policy: always
    container_name: routemaker
    ports:
      - "8517:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

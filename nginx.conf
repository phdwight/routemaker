server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip static assets (app.js is ~60KB)
    gzip              on;
    gzip_types        text/css application/javascript image/svg+xml;
    gzip_min_length   1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML should always be revalidated; hashed-free assets get light caching.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # VERSION must always reflect the running image (drives the in-app version).
    location = /VERSION {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
